<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:375px; background:#f4f7f5; font-family:'Microsoft YaHei','PingFang SC',sans-serif; color:#1f2937; font-size:14px; line-height:1.5; }
.page { padding-bottom:30px; }
.card { background:#fff; border-radius:12px; padding:14px; margin:10px 12px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
.card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.card-title { font-size:15px; font-weight:600; }
.clear-link { color:#9ca3af; font-size:12px; }
.empty { color:#c4c9c8; font-size:12px; text-align:center; padding:8px 0; }
.news-item { display:flex; align-items:flex-start; padding:9px 0; border-bottom:1px solid #f1f2f1; }
.news-item:last-child { border-bottom:none; }
.news-ico { width:36px; height:36px; line-height:36px; text-align:center; font-size:18px; border-radius:50%; background:#dcfce7; flex-shrink:0; }
.news-main { flex:1; margin:0 8px; }
.news-title { font-size:14px; font-weight:600; }
.news-text { font-size:12px; color:#6b7280; margin-top:3px; line-height:1.6; white-space:pre-line; }
.news-time { font-size:10px; color:#9ca3af; flex-shrink:0; }
</style>
</head>
<body>
<div class="page">

  <div class="card">
    <div class="card-head">
      <span class="card-title">📬 消息中心</span>
      <span class="clear-link">清空</span>
    </div>
    <div class="news-item">
      <div class="news-ico">🏅</div>
      <div class="news-main">
        <div class="news-title">解锁新成就</div>
        <div class="news-text">🔥 连续3天</div>
      </div>
      <div class="news-time">8/17 21:30</div>
    </div>
    <div class="news-item">
      <div class="news-ico">✅</div>
      <div class="news-main">
        <div class="news-title">完成今日打卡</div>
        <div class="news-text">得分 83 · 未达标：喝水2L</div>
      </div>
      <div class="news-time">8/17 21:29</div>
    </div>
    <div class="news-item">
      <div class="news-ico">⚖️</div>
      <div class="news-main">
        <div class="news-title">记录体重 98.4 kg</div>
        <div class="news-text">🎉 减了 0.2 kg
近30天每周约减 0.8 kg，节奏健康，保持！
按当前节奏，预计 2027 年 7 月可达标 65 kg</div>
      </div>
      <div class="news-time">8/17 08:05</div>
    </div>
    <div class="news-item">
      <div class="news-ico">👨‍👩‍👧</div>
      <div class="news-main">
        <div class="news-title">家庭组创建成功</div>
        <div class="news-text">邀请码：A1B2C3</div>
      </div>
      <div class="news-time">8/15 20:12</div>
    </div>
    <div class="news-item">
      <div class="news-ico">🎉</div>
      <div class="news-main">
        <div class="news-title">里程碑突破！</div>
        <div class="news-text">体重突破 100 kg 大关</div>
      </div>
      <div class="news-time">8/10 07:58</div>
    </div>
  </div>

</div>
</body>
</html>
